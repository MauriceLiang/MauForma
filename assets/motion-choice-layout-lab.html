<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MauForma · Motion Choice Lab</title>
<style>
:root { color-scheme:light; font: 16px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif; --duration:0ms; --distance:0px; --ease:cubic-bezier(.2,0,.35,1); --border:#d7dfe4; --text:#202b34; --muted:#60717c; --panel:#fff; --bg:#f5f7f8; }
:root[data-motion="balanced"]{--duration:190ms;--distance:9px}
:root[data-motion="expressive"]{--duration:360ms;--distance:22px}
:root[data-reduced="true"]{--duration:0ms;--distance:0px}
@media(prefers-reduced-motion:reduce){:root[data-motion]{--duration:0ms;--distance:0px}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
main{max-width:820px;margin:auto;padding:clamp(18px,4vw,40px) 18px 100px}
h1{font-size:1.8rem;line-height:1.2;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:65ch}
.settings,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.settings{margin-bottom:18px}
button{font:inherit;white-space:nowrap;cursor:pointer;border:1px solid #bac9d1;background:#fff;color:var(--text);border-radius:8px;padding:10px 13px;min-height:42px}
button:focus-visible,input:focus-visible{outline:3px solid #4a8eb6;outline-offset:2px}
button[aria-pressed="true"],button[aria-selected="true"]{background:#dfeaf0;border-color:#8babbc;font-weight:650}
button:active{transform:scale(.985)}
button{transition:background-color var(--duration) var(--ease),transform var(--duration) var(--ease)}
[data-reduced="true"] button{transition:none}
.reduced{display:inline-flex;gap:8px;align-items:center;font-size:.95rem}
.hint{margin:6px 0 20px;color:var(--muted);font-size:.88rem}
.stage{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;min-height:325px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pane{padding:14px 0;min-height:115px}
.pane.motion-in{animation:enter var(--duration) var(--ease) both}
@keyframes enter{from{opacity:.3;transform:translateY(var(--distance))}to{opacity:1;transform:translateY(0)}}
.pane h2{font-size:1.3rem;margin:0 0 7px}
.pane p{margin:0;max-width:55ch;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#message{margin-top:15px;min-height:28px;color:#276347;font-weight:600}
#message.motion-in{animation:enter var(--duration) var(--ease) both}
dialog{border:1px solid #b9cbd4;border-radius:12px;padding:24px;max-width:min(420px,calc(100vw - 36px));box-shadow:0 20px 55px #182c3840}
dialog::backdrop{background:#18263088}
dialog[open]{animation:enter var(--duration) var(--ease) both}
dialog h2{margin:0 0 10px}
.foot{color:var(--muted);font-size:.84rem;margin-top:17px}
</style>
</head>
<body>
<main>
<h1>Motion Choice · 动效选择实验</h1>
<p class="lead">这是原创模拟 UI，用来比较三种用户可选择的动效强度，并验证交互反馈、快速切换、键盘焦点和减少动态效果。不是正式产品源码。</p>
<div class="settings" role="group" aria-label="动效强度">
<button type="button" data-motion-option="none" aria-pressed="false">A · 干净利落</button>
<button type="button" data-motion-option="balanced" aria-pressed="true">B · 细腻流畅</button>
<button type="button" data-motion-option="expressive" aria-pressed="false">C · 有表现力</button>
<label class="reduced"><input id="reduce" type="checkbox">减少动态效果</label>
</div>
<p class="hint" id="motion-description">B：交互反馈、内容面板和弹窗使用短暂过渡。</p>
<section class="stage" aria-label="交互效果测试">
<div class="tabs" role="tablist" aria-label="示例内容">
<button type="button" id="tab-a" role="tab" aria-selected="true" tabindex="0" aria-controls="pane">概览</button>
<button type="button" id="tab-b" role="tab" aria-selected="false" tabindex="-1" aria-controls="pane">分析</button>
</div>
<div id="pane" class="pane" role="tabpanel" aria-labelledby="tab-a">
<h2 id="pane-heading">当前概览</h2>
<p id="pane-description">切换 Tab 时观察内容如何响应：无论是否启用动效，文字和交互都应立即可见。</p>
</div>
<div class="actions">
<button id="open-dialog" type="button">打开详情</button>
<button id="show-result" type="button">模拟成功反馈</button>
</div>
<p role="status" aria-live="polite" id="message"></p>
</section>
<p class="foot">实测说明：切换 A/B/C 不代表用户实际偏好已被选择。浏览器减少动效或勾选减弱选项时，非必要运动将直接取消，内容和键盘操作保留。</p>
</main>
<dialog id="details" aria-labelledby="details-title">
<h2 id="details-title">操作详情</h2><p>这个弹窗可由键盘打开并按 Escape 关闭，动效不得阻塞操作。</p>
<button type="button" id="close-dialog">关闭</button>
</dialog>
<script>
const root=document.documentElement;
const options=document.querySelectorAll('[data-motion-option]');
const desc=document.getElementById('motion-description');
const reduce=document.getElementById('reduce');
const pref=window.matchMedia('(prefers-reduced-motion: reduce)');
const messages={
 none:'A：不加入额外运动。选中、焦点、结果和状态仍明确可见。',
 balanced:'B：交互反馈、内容面板和弹窗使用短暂过渡。',
 expressive:'C：内容与弹窗使用更明显、但可中断的定向过渡。'
};
function syncReduction(){root.dataset.reduced=String(reduce.checked||pref.matches)}
reduce.addEventListener('change',syncReduction);
if(pref.addEventListener) pref.addEventListener('change',syncReduction);
syncReduction();root.dataset.motion='balanced';
options.forEach(button=>button.addEventListener('click',()=>{
 root.dataset.motion=button.dataset.motionOption;
 options.forEach(item=>item.setAttribute('aria-pressed',String(button===item)));
 desc.textContent=messages[root.dataset.motion];
}));
const tabs=[document.getElementById('tab-a'),document.getElementById('tab-b')],pane=document.getElementById('pane');
function chooseTab(index){
 tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(index===i));tab.tabIndex=index===i?0:-1});
 pane.setAttribute('aria-labelledby',tabs[index].id);
 document.getElementById('pane-heading').textContent=index===0?'当前概览':'趋势分析';
 document.getElementById('pane-description').textContent=index===0?'切换 Tab 时观察内容如何响应：无论是否启用动效，文字和交互都应立即可见。':'数据切换应先更新可读状态，再执行可选过渡；本示例没有真实分析 API。';
 pane.classList.remove('motion-in');void pane.offsetWidth;pane.classList.add('motion-in');
}
tabs.forEach((tab,i)=>{
 tab.addEventListener('click',()=>chooseTab(i));
 tab.addEventListener('keydown',event=>{
  if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
   event.preventDefault();const next=(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
   chooseTab(next);tabs[next].focus();
  }
 });
});
const dialog=document.getElementById('details');
document.getElementById('open-dialog').addEventListener('click',()=>dialog.showModal());
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
const msg=document.getElementById('message');
document.getElementById('show-result').addEventListener('click',()=>{
 msg.textContent='模拟操作已完成';
 msg.classList.remove('motion-in');void msg.offsetWidth;msg.classList.add('motion-in');
});
</script>
</body>
</html>
