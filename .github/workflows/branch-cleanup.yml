name: MauForma Auto-delete Merged PR Branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  prune-merged-pr-branch:
    name: Delete source branch after PR merge
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head (same repository only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BRANCH" || "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo 'Refusing to delete empty/default branch'
            exit 1
          fi
          encoded=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe="/"))' "$BRANCH")
          if gh api "repos/$REPO/branches/$encoded" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded"
            echo "Deleted merged PR branch: $BRANCH"
          else
            echo "Merged PR branch already absent: $BRANCH"
          fi
