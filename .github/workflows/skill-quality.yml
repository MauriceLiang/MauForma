name: MauForma Skill Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original skill
        run: |
          python3 scripts/validate_web_skill.py
          python3 scripts/validate_design_system.py
          python3 scripts/validate_motion_catalog.py
      - name: Validate design intelligence
        run: |
          python3 scripts/validate_intelligence.py
          python3 scripts/validate_ui_patterns.py
          python3 scripts/validate_composition_brief.py examples/composition/repo-analysis.json --repository
          python3 scripts/audit_readability.py --validate-catalog
          python3 scripts/validate_sidebar_color_decision.py --repository
          python3 scripts/validate_navigation_architecture.py --repository
          python3 scripts/validate_page_content_plan.py examples/page-content-plan-repovantage.json --repository
          python3 scripts/validate_layout_integrity.py examples/layout-integrity-repovantage.json --repository
          node --check scripts/audit_rendered_layout.mjs
          python3 scripts/validate_comparison_contract.py examples/comparison-contract-repovantage.json --repository
          python3 scripts/validate_task_center.py examples/task-center-repovantage.json --repository
          node --check scripts/audit_comparison_ui.mjs
          python3 -m unittest discover -s tests -v
      - name: Syntax check browser QA script
        run: node --check scripts/browser_qa.mjs

  comparison-browser:
    name: Comparison + task-center browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA dependency
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Validate comparison interactions and scroll-end in Chromium
        run: node tests/comparison_browser_smoke.mjs
      - name: Validate task-center interactions, status actions and scroll-end
        run: node tests/task_center_browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-design-browser-screenshots
          path: |
            comparison-browser-artifacts/
            task-center-browser-artifacts/
          if-no-files-found: ignore
