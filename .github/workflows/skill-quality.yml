name: MauForma Skill Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original skill
        run: |
          python3 scripts/validate_web_skill.py
          python3 scripts/validate_skill_hygiene.py
          python3 scripts/validate_design_system.py
          python3 scripts/validate_motion_catalog.py
      - name: Validate design intelligence
        run: |
          python3 scripts/validate_intelligence.py
          python3 scripts/validate_ui_patterns.py
          python3 scripts/validate_composition_brief.py examples/composition/repo-analysis.json --repository
          python3 scripts/audit_readability.py --validate-catalog
          python3 scripts/validate_visual_priority.py --repository
          python3 scripts/validate_surface_control.py --repository
          python3 scripts/validate_motion_decision.py --repository
          python3 scripts/validate_component_motion.py --repository
          python3 scripts/validate_spacing_rhythm.py --repository
          python3 scripts/validate_icon_curation.py --repository
          python3 scripts/validate_design_reference.py --repository
          python3 scripts/validate_proactive_audit.py --repository
          python3 scripts/validate_product_experience.py
          python3 scripts/validate_settings_form_layout.py --repository
          node --check tests/settings_form_browser_smoke.mjs
          python3 scripts/validate_sidebar_color_decision.py --repository
          python3 scripts/validate_navigation_architecture.py --repository
          python3 scripts/validate_page_content_plan.py examples/page-content-plan-repovantage.json --repository
          python3 scripts/validate_layout_integrity.py examples/layout-integrity-repovantage.json --repository
          node --check scripts/audit_rendered_layout.mjs
          python3 scripts/validate_comparison_contract.py examples/comparison-contract-repovantage.json --repository
          python3 scripts/validate_task_center.py examples/task-center-repovantage.json --repository
          node --check scripts/audit_comparison_ui.mjs
          node --check tests/surface_control_browser_smoke.mjs
          node --check tests/motion_choice_browser_smoke.mjs
          node --check tests/component_motion_browser_smoke.mjs
          node --check scripts/audit_spacing_rhythm.mjs
          node --check scripts/audit_panel_spacing.mjs
          node --check scripts/audit_existing_visual_defects.mjs
          node --check tests/existing_visual_defect_browser_smoke.mjs
          node --check tests/panel_spacing_browser_smoke.mjs
          node --check tests/spacing_rhythm_browser_smoke.mjs
          node --check scripts/audit_icon_consistency.mjs
          node --check tests/icon_art_direction_browser_smoke.mjs
          node --check tests/design_reference_browser_smoke.mjs
          python3 -m unittest discover -s tests -v
      - name: Syntax check browser QA script
        run: node --check scripts/browser_qa.mjs

  comparison-browser:
    name: Comparison + task-center browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA dependency
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Validate comparison interactions and scroll-end in Chromium
        run: node tests/comparison_browser_smoke.mjs
      - name: Validate generic surface modes and atomic control geometry
        run: node tests/surface_control_browser_smoke.mjs
      - name: Validate user-owned motion choices and reduced motion in Chromium
        run: node tests/motion_choice_browser_smoke.mjs
      - name: Validate component motion choreography in Chromium
        run: node tests/component_motion_browser_smoke.mjs
      - name: Validate semantic spacing, responsive rhythm, intentional connections
        run: node tests/spacing_rhythm_browser_smoke.mjs
      - name: Validate unannotated panel spacing and regression in Chromium
        run: node tests/panel_spacing_browser_smoke.mjs
      - name: Validate detection of pre-existing visible defects in Chromium
        run: node tests/existing_visual_defect_browser_smoke.mjs
      - name: Validate settings/form layout in Chromium
        run: node tests/settings_form_browser_smoke.mjs
      - name: Validate curated icon geometry, labels and consistency in Chromium
        run: node tests/icon_art_direction_browser_smoke.mjs
      - name: Validate synthetic reference-learning demo in Chromium
        run: node tests/design_reference_browser_smoke.mjs
      - name: Validate task-center interactions, status actions and scroll-end
        run: node tests/task_center_browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-design-browser-screenshots
          path: |
            comparison-browser-artifacts/
            task-center-browser-artifacts/
            surface-control-browser-artifacts/
            motion-choice-browser-artifacts/
            component-motion-browser-artifacts/
            spacing-rhythm-browser-artifacts/
            panel-spacing-browser-artifacts/
            icon-art-direction-browser-artifacts/
            reference-learning-browser-artifacts/
          if-no-files-found: ignore
